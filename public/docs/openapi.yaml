openapi: 3.0.3
info:
  title: 'Maskanoor Group API Documentation'
  description: 'Maskanoor Group API v1 — Sanctum token auth, listings, bookings, favorites, and profile.'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1:8000'
tags:
  -
    name: Auth
    description: ''
  -
    name: Bookings
    description: ''
  -
    name: Endpoints
    description: ''
  -
    name: Favorites
    description: ''
  -
    name: Listings
    description: ''
  -
    name: Profile
    description: ''
  -
    name: 'Two-factor authentication'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtain a token via <code>POST /api/v1/auth/login</code> or <code>POST /api/v1/auth/register</code>. Send as <code>Authorization: Bearer {token}</code>.'
security:
  -
    default: []
paths:
  /api/v1/auth/register:
    post:
      summary: 'Register a client account.'
      operationId: registerAClientAccount
      description: ''
      parameters: []
      responses: {}
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 120 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: zbailey@example.net
                phone:
                  type: string
                  description: 'Must not be greater than 40 characters.'
                  example: i
                  nullable: true
                password:
                  type: string
                  description: ''
                  example: architecto
              required:
                - name
                - email
                - password
      security: []
  /api/v1/auth/login:
    post:
      summary: 'Login and receive a Sanctum token.'
      operationId: loginAndReceiveASanctumToken
      description: ''
      parameters: []
      responses: {}
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                device_name:
                  type: string
                  description: 'Must not be greater than 80 characters.'
                  example: v
                  nullable: true
                two_factor_code:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
              required:
                - email
                - password
      security: []
  /api/v1/auth/two-factor-challenge:
    post:
      summary: 'Complete a two-factor challenge from login.'
      operationId: completeATwoFactorChallengeFromLogin
      description: ''
      parameters: []
      responses: {}
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                two_factor_token:
                  type: string
                  description: ''
                  example: architecto
                code:
                  type: string
                  description: ''
                  example: architecto
                device_name:
                  type: string
                  description: 'Must not be greater than 80 characters.'
                  example: 'n'
                  nullable: true
              required:
                - two_factor_token
                - code
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Logout current token.'
      operationId: logoutCurrentToken
      description: ''
      parameters: []
      responses: {}
      tags:
        - Auth
  /api/v1/bookings:
    get:
      summary: ''
      operationId: getApiV1Bookings
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: Unauthenticated.
                  code: unauthenticated
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated.
                  code:
                    type: string
                    example: unauthenticated
      tags:
        - Bookings
    post:
      summary: ''
      operationId: postApiV1Bookings
      description: ''
      parameters: []
      responses: {}
      tags:
        - Bookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                room_type_id:
                  type: string
                  description: 'Must match an existing stored value.'
                  example: architecto
                check_in:
                  type: string
                  description: 'Must be a valid date. Must be a date after or equal to <code>today</code>.'
                  example: '2052-11-12'
                check_out:
                  type: string
                  description: 'Must be a valid date. Must be a date after <code>check_in</code>.'
                  example: '2052-11-12'
                guests:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 50.'
                  example: 22
                cancellation_policy:
                  type: string
                  description: ''
                  example: null
                  nullable: true
                notes:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: g
                  nullable: true
              required:
                - room_type_id
                - check_in
                - check_out
                - guests
  '/api/v1/bookings/{id}':
    get:
      summary: ''
      operationId: getApiV1BookingsId
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: Unauthenticated.
                  code: unauthenticated
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated.
                  code:
                    type: string
                    example: unauthenticated
      tags:
        - Bookings
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the booking.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/v1/bookings/{booking_id}/cancel':
    post:
      summary: ''
      operationId: postApiV1BookingsBooking_idCancel
      description: ''
      parameters: []
      responses: {}
      tags:
        - Bookings
    parameters:
      -
        in: path
        name: booking_id
        description: 'The ID of the booking.'
        example: 16
        required: true
        schema:
          type: integer
